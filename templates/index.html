<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Social Media Downloader</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap');
:root{--ink:#172033;--muted:#68748a;--line:#e4e8ef;--blue:#1769e0;--blue-dark:#0e4fae;--red:#b42318}
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);font-family:'DM Sans',sans-serif;background:radial-gradient(circle at 8% 0%,#dfeaff 0,transparent 32%),linear-gradient(135deg,#f8fafc,#eef2f7)}
.shell{width:min(940px,calc(100% - 32px));margin:auto;padding:28px 0 48px}header{display:flex;align-items:center;justify-content:space-between;margin-bottom:72px}.brand{display:flex;align-items:center;gap:11px;font:700 16px 'Space Grotesk',sans-serif}.brand-mark{display:grid;place-items:center;width:34px;height:34px;border-radius:11px;color:white;background:var(--blue);box-shadow:0 7px 18px #1769e033}.brand-mark:before{content:'↗';font-size:21px}.status-pill{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px}.status-pill:before{content:'';width:7px;height:7px;border-radius:50%;background:#3dbb7c;box-shadow:0 0 0 4px #3dbb7c22}
main{max-width:760px;margin:auto}.eyebrow{margin:0 0 14px;color:var(--blue);font-size:12px;font-weight:700;letter-spacing:.13em;text-transform:uppercase}h1{max-width:650px;margin:0;font:700 clamp(40px,7vw,70px)/.98 'Space Grotesk',sans-serif;letter-spacing:-.065em}.intro{max-width:590px;margin:22px 0 34px;color:var(--muted);font-size:17px;line-height:1.55}.workbench{padding:24px;border:1px solid white;border-radius:24px;background:#ffffffd9;box-shadow:0 22px 60px #1b315014,0 2px 5px #1b31500a;backdrop-filter:blur(12px)}
.platforms{display:flex;gap:8px;margin-bottom:18px}.platform{border:1px solid var(--line);border-radius:10px;padding:9px 13px;color:var(--muted);background:white;font:600 13px 'DM Sans',sans-serif;cursor:pointer;transition:.18s}.platform:hover,.platform.active{border-color:#a8c6f5;color:var(--blue);background:#f0f6ff}.input-row{display:flex;gap:10px}input{min-width:0;flex:1;border:1px solid var(--line);border-radius:13px;padding:16px 17px;color:var(--ink);background:#fbfcfe;font:15px 'DM Sans',sans-serif;outline:none}input:focus{border-color:#7ca9ee;background:white;box-shadow:0 0 0 4px #1769e014}.primary{border:0;border-radius:13px;padding:0 23px;color:white;background:var(--blue);font:700 14px 'DM Sans',sans-serif;cursor:pointer;box-shadow:0 8px 16px #1769e02e;transition:.18s}.primary:hover{background:var(--blue-dark);transform:translateY(-1px)}.primary:disabled{opacity:.6;cursor:wait;transform:none}.status{min-height:22px;margin:15px 2px 0;color:var(--muted);font-size:13px}.status.error{color:var(--red)}.results{margin-top:26px}.section-title{margin:25px 0 10px;color:var(--muted);font-size:11px;font-weight:700;letter-spacing:.13em;text-transform:uppercase}.media-item{display:flex;align-items:center;gap:13px;margin-bottom:9px;padding:10px;border:1px solid var(--line);border-radius:14px;background:white}.media-item img,.placeholder{width:54px;height:54px;flex:none;border-radius:9px;object-fit:cover}.placeholder{display:grid;place-items:center;color:var(--blue);background:#edf4ff;font-size:11px;font-weight:700}.label{min-width:0;flex:1;color:var(--ink);font-size:13px;font-weight:600}.download-btn{border-radius:9px;padding:9px 12px;color:var(--blue);background:#edf4ff;font-size:12px;font-weight:700;text-decoration:none;white-space:nowrap}.download-btn:hover{background:#dceaff}footer{margin-top:72px;color:#8b95a6;font-size:12px;text-align:center}
@media(max-width:600px){.shell{width:calc(100% - 24px);padding-top:18px}header{margin-bottom:54px}.status-pill{display:none}.intro{font-size:15px}.workbench{padding:16px;border-radius:18px}.platforms{flex-wrap:wrap}.input-row{flex-direction:column}.primary{min-height:50px}.media-item .download-btn{padding:9px;font-size:0}.media-item .download-btn:after{content:'↓';font-size:17px}}
</style>
</head>
<body>
<div class="shell"><header><div class="brand"><span class="brand-mark"></span>Social Media Downloader</div><div class="status-pill">Servizio online</div></header>
<main><p class="eyebrow">Download semplice, senza frizioni</p><h1>Porta i tuoi contenuti con te.</h1><p class="intro">Incolla un link pubblico da LinkedIn, Instagram o TikTok e scarica immagini e video in pochi secondi.</p>
<section class="workbench"><div class="platforms" aria-label="Scegli piattaforma"><button class="platform active" data-platform="instagram">Instagram</button><button class="platform" data-platform="tiktok">TikTok</button><button class="platform" data-platform="linkedin">LinkedIn</button></div><div class="input-row"><input type="text" id="postUrl" placeholder="https://www.instagram.com/reel/..." autocomplete="url"><button class="primary" id="extractBtn">Analizza link</button></div><div id="status" class="status" aria-live="polite"></div><div id="results" class="results"></div></section></main><footer>Solo contenuti pubblici che hai il diritto di scaricare.</footer></div>
<script>
const extractBtn=document.getElementById('extractBtn'),postUrlInput=document.getElementById('postUrl'),statusEl=document.getElementById('status'),resultsEl=document.getElementById('results');const placeholders={instagram:'https://www.instagram.com/reel/...',tiktok:'https://www.tiktok.com/@utente/video/...',linkedin:'https://www.linkedin.com/posts/...'};
document.querySelectorAll('.platform').forEach(button=>button.addEventListener('click',()=>{document.querySelectorAll('.platform').forEach(item=>item.classList.remove('active'));button.classList.add('active');postUrlInput.placeholder=placeholders[button.dataset.platform];postUrlInput.focus()}));
function setStatus(text,type){statusEl.textContent=text||'';statusEl.className='status'+(type?' '+type:'')}
function renderMediaSection(title,items,kind,sourceUrl){if(!items.length)return '';let html=`<div class="section-title">${title}</div>`;items.forEach((url,i)=>{const filename=`social-${kind}-${i+1}.${kind==='immagine'?'jpg':'mp4'}`,endpoint=kind==='video'&&sourceUrl?'/api/social-download':'/api/proxy-download',value=kind==='video'&&sourceUrl?sourceUrl:url,downloadUrl=`${endpoint}?url=${encodeURIComponent(value)}&filename=${encodeURIComponent(filename)}`,preview=kind==='immagine'?`<img src="${url}" alt="Anteprima immagine">`:'<div class="placeholder">VIDEO</div>';html+=`<div class="media-item">${preview}<div class="label">${kind==='immagine'?'Immagine':'Video'} ${i+1}</div><a class="download-btn" href="${downloadUrl}">Scarica</a></div>`});return html}
async function extract(){const url=postUrlInput.value.trim();resultsEl.innerHTML='';if(!url){setStatus('Incolla prima un link.','error');return}extractBtn.disabled=true;extractBtn.textContent='Analisi...';setStatus('Sto cercando i media pubblici...','info');try{const res=await fetch('/api/extract',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({url})}),text=await res.text();let data;try{data=JSON.parse(text)}catch{data={error:'Il server ha restituito una risposta non valida.'}}if(!res.ok){setStatus(data.error||'Errore sconosciuto.','error');return}setStatus(data.title?`Trovato: "${data.title}"`:'Media trovati.','info');resultsEl.innerHTML=renderMediaSection('Immagini',data.images||[],'immagine')+renderMediaSection('Video',data.videos||[],'video',data.download_source)}catch(error){setStatus('Errore di rete: '+error.message,'error')}finally{extractBtn.disabled=false;extractBtn.textContent='Analizza link'}}
extractBtn.addEventListener('click',extract);postUrlInput.addEventListener('keydown',event=>{if(event.key==='Enter')extract()});
</script>
</body>
</html>
